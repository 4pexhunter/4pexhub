<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4pexhunter — not found</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c1220;
    --line:#26324a;
    --blue:#5b8def;
    --blue-dim:#7f95bd;
    --paper:#e7ecf7;
    --mono:'IBM Plex Mono', monospace;
    --disp:'Archivo Expanded', sans-serif;
    --body:'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink); color:var(--paper); font-family:var(--body);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
  }
  .box{ text-align:left; max-width:420px; padding:0 24px; }
  .code{
    font-family:var(--mono); font-size:13px; color:var(--blue-dim);
    margin-bottom:16px;
  }
  h1{
    font-family:var(--disp); font-weight:800; font-size:clamp(40px,10vw,64px);
    line-height:0.95; color:var(--paper); margin-bottom:16px;
  }
  h1 .accent{color:var(--blue);}
  p{ color:#b9c2d9; font-size:15px; margin-bottom:24px; }
  a.back{
    font-family:var(--mono); font-size:13px; color:var(--blue);
    text-decoration:none; border:1px solid var(--blue); padding:9px 14px;
    display:inline-block;
  }
  a.back:hover{ background:var(--blue); color:var(--ink); }
</style>
</head>
<body>
  <div class="box">
    <div class="code">ERROR 404</div>
    <h1>not <span class="accent">found</span></h1>
    <p>Whatever you were tracking down isn't here.</p>
    <a class="back" href="index.html">← back home</a>
  </div>
</body>
</html>
